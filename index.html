<!DOCTYPE html>
<html lang="cs" translate="no">
<head>
    <meta charset="UTF-8">
    <title>Rohlík.cz – Jazykový test (ČJ)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="google" content="notranslate">
    <style>
        :root {
            --rohlik: #f6a623; --rohlik-glow: rgba(246, 166, 35, 0.4);
            --bg: #0f172a; --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f8fafc; --text-muted: #94a3b8;
            --success: #2ecc71; --danger: #e74c3c;
        }

        body {
            margin: 0; font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            user-select: none; -webkit-user-select: none;
        }

        /* GLASSMORPHISM KARTA */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%; max-width: 480px;
            margin: auto; transition: 0.4s;
        }

        header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .q-timer-ring {
            width: 40px; height: 40px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--rohlik);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px;
        }

        .progress-bar {
            position: fixed; top: 0; left: 0; height: 4px;
            background: var(--rohlik); transition: 0.3s;
            box-shadow: 0 0 15px var(--rohlik); z-index: 101;
        }

        h2 { font-weight: 800; letter-spacing: -1px; text-align: center; margin-bottom: 30px; }

        input {
            width: 100%; padding: 16px; margin-bottom: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; color: white; font-size: 16px; outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--rohlik); background: rgba(255,255,255,0.1); }

        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: 18px;
            background: var(--rohlik); color: white; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

        .ans-btn {
            width: 100%; padding: 18px; margin-bottom: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px; color: var(--text); text-align: left;
            font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .ans-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .ans-btn.selected { border-color: var(--rohlik); background: var(--rohlik-glow); }

        #error-msg { color: var(--danger); text-align: center; font-weight: bold; margin: 10px 0; display: none; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .low-time { color: var(--danger); animation: pulse 1s infinite; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="progress" class="progress-bar"></div>

<header id="main-header" style="display:none;">
    <img src="rohlik-logo.png" style="height:25px;" onerror="this.style.display='none'">
    <div style="display:flex; gap:15px; align-items:center;">
        <div id="q-timer" class="q-timer-ring">45</div>
        <div id="q-idx" style="font-weight:bold; color:var(--text-muted)">1/25</div>
    </div>
</header>

<div class="container" style="flex:1; display:flex;">
    <div id="screen-login" class="glass-card">
        <h2>Jazykový test (ČJ)</h2>
        <input type="text" id="name-n" placeholder="Jméno kurýra">
        <input type="text" id="name-t" placeholder="Jméno trenéra">
        <input type="password" id="pass-t" placeholder="Heslo trenéra">
        <div id="error-msg"></div>
        <button class="btn-main" id="btn-start" onclick="startTest()">Spustit test</button>
    </div>

    <div id="screen-test" class="glass-card" style="display:none">
        <h3 id="q-text" style="line-height:1.4"></h3>
        <div id="answers"></div>
        <button class="btn-main" id="btn-next" onclick="nextQuestion()" disabled>Další otázka</button>
    </div>

    <div id="screen-res" class="glass-card" style="display:none; text-align:center;">
        <div id="res-icon" style="font-size:60px"></div>
        <h2 id="res-score"></h2>
        <p id="res-status" style="font-size:18px; font-weight:bold;"></p>
        <button class="btn-main" onclick="location.reload()">Nový test</button>
    </div>
</div>

<script>
// --- KONFIGURACE ---
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbylbGGi498B00Tyjrjhlo1FUJKPbWCr8QYsOX1cNUvav7inqfGAkvG-WExKolS0SmmE6A/exec";
// Heslo je "ROH26" (v Base64)
const HASHED_PASS = "Uk9IMjY=";
const Q_LIMIT = 25;
const SECONDS_PER_Q = 45;
const MAX_ERRORS = 5;

// --- BANKA OTÁZEK - ČEŠTINA A1/A2 ---
const BANK = [
  // --- ZÁKLADNÍ FRÁZE A ZDRAVENÍ ---
  { cat: "Fráze", q: "Jak správně pozdravíte zákazníka ráno?", a: ["Dobré ráno.", "Dobrý večer.", "Na shledanou.", "Dobrou noc."], c: 0 },
  { cat: "Fráze", q: "Když zákazníkovi předáváte nákup, co řeknete?", a: ["Tady je váš nákup.", "Co chcete?", "Já chci nákup.", "Kde je nákup?"], c: 0 },
  { cat: "Fráze", q: "Zákazník vám řekne: „Děkuji.“ Co odpovíte?", a: ["Prosím. / Není zač.", "Ano, děkuji.", "Ne.", "Omlouvám se."], c: 0 },
  { cat: "Fráze", q: "Jak se rozloučíte po předání nákupu?", a: ["Na shledanou, hezký den.", "Dobré ráno.", "Dobrý den.", "Haló."], c: 0 },
  { cat: "Fráze", q: "Jak se slušně omluvíte za zpoždění?", a: ["Omlouvám se za zpoždění.", "Tady jsem.", "Mám zpoždění, no a?", "Děkuji za zpoždění."], c: 0 },
  { cat: "Fráze", q: "Co řeknete, když zákazníkovi nerozumíte?", a: ["Nerozumím vám, můžete to zopakovat, prosím?", "Nemluvte.", "Já vím.", "Nechci slyšet."], c: 0 },

  // --- TELEFONOVÁNÍ ---
  { cat: "Telefonování", q: "Jak začnete telefonní hovor se zákazníkem?", a: ["Dobrý den, tady kurýr Rohlíku.", "Já jsem tady.", "Otevřete.", "Kdo volá?"], c: 0 },
  { cat: "Telefonování", q: "Zákazník to zvedne a špatně ho slyšíte. Jak to řeknete česky?", a: ["Omlouvám se, špatně vás slyším.", "Haló, mluvte!", "Položím to.", "Vy neslyšíte."], c: 0 },
  { cat: "Telefonování", q: "Potřebujete, aby zákazník přišel dolů. Jak to řeknete?", a: ["Můžete prosím přijít dolů?", "Já nahoru nejdu.", "Jděte ven.", "Kde jste?"], c: 0 },
  { cat: "Telefonování", q: "Chcete zákazníkovi říct, že dorazíte za 5 minut. Co řeknete?", a: ["Budu u vás za pět minut.", "Jsem tam pět minut.", "Za chvíli je pět.", "Čekám pět minut."], c: 0 },

  // --- ORIENTACE A ADRESY ---
  { cat: "Orientace", q: "Co znamená slovo „Vchod“?", a: ["Entrance", "Exit", "Window", "Floor"], c: 0 },
  { cat: "Orientace", q: "Zákazník bydlí v 5. patře. Co znamená „Patro“?", a: ["Floor", "Building", "Door", "Street"], c: 0 },
  { cat: "Orientace", q: "Co znamená české slovo „Výtah“?", a: ["Elevator / Lift", "Stairs", "Door", "Bell"], c: 0 },
  { cat: "Orientace", q: "Co znamená české slovo „Schody“?", a: ["Stairs", "Floor", "Elevator", "House"], c: 0 },
  { cat: "Orientace", q: "Jak se česky řekne „Left“ a „Right“?", a: ["Vlevo a vpravo", "Dole a nahoře", "Rovně a zpět", "Tady a tam"], c: 0 },
  { cat: "Orientace", q: "Nevíte, kde je dům zákazníka. Jak se zeptáte?", a: ["Kde přesně bydlíte?", "Odkud jste?", "Kam jdete?", "Kdo jste?"], c: 0 },
  { cat: "Orientace", q: "Co znamená, když má zákazník v poznámce „Zvoňte“?", a: ["Musím zazvonit na zvonek.", "Musím mu zavolat na mobil.", "Nemám zvonit.", "Mám čekat v autě."], c: 0 },

  // --- PLACENÍ A NÁKUP ---
  { cat: "Placení", q: "Zákazník se ptá: „Můžu platit kartou?“ Co odpovíte, když terminál funguje?", a: ["Ano, samozřejmě.", "Ne, nemám.", "Jenom peníze.", "Možná zítra."], c: 0 },
  { cat: "Placení", q: "Co znamená platit „Hotově“?", a: ["Platit penězi (bankovky a mince).", "Platit kartou.", "Platit online.", "Neplatit vůbec."], c: 0 },
  { cat: "Placení", q: "Zákazník chce účtenku. Jak se česky řekne „Receipt“?", a: ["Účtenka", "Taška", "Peníze", "Karta"], c: 0 },
  { cat: "Placení", q: "Předáváte nákup a chcete podpis zákazníka na displej. Co řeknete?", a: ["Podepište se mi tady, prosím.", "Dejte mi to.", "Chci váš telefon.", "Zavolejte mi."], c: 0 },
  { cat: "Placení", q: "Zákazník vám dá peníze navíc (dýško) a řekne „To je dobrý“. Co odpovíte?", a: ["Moc děkuji.", "Nechci to.", "To je málo.", "Kolik to je?"], c: 0 },

  // --- ŘEŠENÍ PROBLÉMŮ / KOMUNIKACE ---
  { cat: "Komunikace", q: "Máte v taškách rozbitá vajíčka. Jak zákazníkovi situaci vysvětlíte?", a: ["Omlouvám se, vajíčka jsou rozbitá. Zavolám na podporu a peníze vám vrátíme.", "Vajíčka jsou špatná. To není můj problém.", "Nemám vajíčka.", "Kupte si nová vajíčka."], c: 0 },
  { cat: "Komunikace", q: "Chybí jedna taška a musíte se vrátit do auta. Co řeknete?", a: ["Hned jsem zpátky, dojdu pro to do auta.", "Já to nemám, nashledanou.", "Zavolám vám zítra.", "Taška není."], c: 0 },
  { cat: "Komunikace", q: "Zákazník má těžký nákup (vodu) a ptá se, jestli mu to dáte za dveře. Co řeknete?", a: ["Ano, dám vám to hned za dveře.", "Ne, to nedělám.", "Vezměte si to.", "Je to moc těžké."], c: 0 },
  { cat: "Komunikace", q: "Chcete, aby zákazník chvíli počkal. Jak to řeknete česky?", a: ["Počkejte chvíli, prosím.", "Rychle!", "Jděte pryč.", "Už jdu."], c: 0 },
  { cat: "Komunikace", q: "Musíte zkontrolovat občanský průkaz (alkohol). Co řeknete?", a: ["Můžu vidět váš občanský průkaz, prosím?", "Máte věk?", "Kde je dokument?", "Dám vám to bez průkazu."], c: 0 }
];

let state = {
    current: 0, score: 0, testSet: [], selected: null,
    tabSwitches: 0, startTime: 0, qStartTime: 0,
    history: [], hesitancy: []
};

// Ochrana proti podvádění
document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.testSet.length > 0) {
        state.tabSwitches++;
    }
});

function startTest() {
    const n = document.getElementById('name-n').value.trim();
    const t = document.getElementById('name-t').value.trim();
    const p = document.getElementById('pass-t').value.trim();
    
    if (!n || !t) { document.getElementById('error-msg').innerText = "Vyplňte jména!"; document.getElementById('error-msg').style.display = 'block'; return; }
    if (btoa(p) !== HASHED_PASS) { document.getElementById('error-msg').innerText = "Špatné heslo!"; document.getElementById('error-msg').style.display = 'block'; return; }

    state.testSet = BANK.sort(() => 0.5 - Math.random()).slice(0, Q_LIMIT);
    state.startTime = Date.now();
    
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('screen-test').style.display = 'block';
    
    renderQuestion();
}

let qTimer;
function renderQuestion() {
    clearInterval(qTimer);
    const q = state.testSet[state.current];
    
    let qText = q.q;
    
    document.getElementById('q-text').innerText = qText;
    document.getElementById('q-idx').innerText = `${state.current + 1}/${Q_LIMIT}`;
    document.getElementById('progress').style.width = `${(state.current / Q_LIMIT) * 100}%`;
    document.getElementById('btn-next').disabled = true;
    
    const ansDiv = document.getElementById('answers');
    ansDiv.innerHTML = "";
    state.selected = null;
    
    // Fisher-Yates míchání (správná odpověď je vždy jinde)
    let answers = q.a.map((text, originalIndex) => ({ text, originalIndex }));
    for (let i = answers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [answers[i], answers[j]] = [answers[j], answers[i]];
    }
    
    answers.forEach(obj => {
        const b = document.createElement('button');
        b.className = "ans-btn";
        b.innerHTML = `<span>${obj.text}</span>`;
        b.onclick = () => {
            if (Date.now() - state.qStartTime < 500) return; 
            document.querySelectorAll('.ans-btn').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
            state.selected = obj.originalIndex;
            document.getElementById('btn-next').disabled = false;
        };
        ansDiv.appendChild(b);
    });

    let sec = SECONDS_PER_Q;
    state.qStartTime = Date.now();
    const timerDiv = document.getElementById('q-timer');
    timerDiv.innerText = sec;
    timerDiv.classList.remove('low-time');

    qTimer = setInterval(() => {
        sec--;
        timerDiv.innerText = sec;
        if (sec <= 10) timerDiv.classList.add('low-time');
        if (sec <= 0) {
            clearInterval(qTimer);
            nextQuestion(true); 
        }
    }, 1000);
}

function nextQuestion(isTimeout = false) {
    const q = state.testSet[state.current];
    const timeSpent = (Date.now() - state.qStartTime) / 1000;
    
    let qCategory = q.cat || "Obecné";
    if (timeSpent > 30) state.hesitancy.push(qCategory);

    const isCorrect = (!isTimeout && state.selected === q.c);
    if (isCorrect) state.score++;
    
    state.history.push({ cat: qCategory, correct: isCorrect });

    if (state.current < Q_LIMIT - 1) {
        state.current++;
        renderQuestion();
    } else {
        finish();
    }
}

function finish() {
    clearInterval(qTimer);
    const passed = state.score >= (Q_LIMIT - MAX_ERRORS);
    const perc = Math.round((state.score / Q_LIMIT) * 100);
    
    let catResults = {};
    state.history.forEach(h => {
        if (!catResults[h.cat]) catResults[h.cat] = { correct: 0, total: 0 };
        catResults[h.cat].total++;
        if (h.correct) catResults[h.cat].correct++;
    });

    document.getElementById('screen-test').style.display = 'none';
    document.getElementById('main-header').style.display = 'none';
    document.getElementById('progress').style.display = 'none';
    document.getElementById('screen-res').style.display = 'block';

    document.getElementById('res-score').innerText = `${state.score} / ${Q_LIMIT}`;
    document.getElementById('res-icon').innerText = passed ? "🎉" : "❌";
    document.getElementById('res-status').innerText = passed ? "SKVĚLÉ, PROŠEL(A) JSI!" : "BOHUŽEL, TO NESTAČÍ.";
    document.getElementById('res-status').style.color = passed ? "var(--success)" : "var(--danger)";

    const payload = {
        noviceName: document.getElementById('name-n').value.trim(),
        trainerName: document.getElementById('name-t').value.trim(),
        score: state.score,
        total: Q_LIMIT,
        percent: perc,
        passed: passed,
        tabSwitches: state.tabSwitches,
        avgTimePerQ: Math.round((Date.now() - state.startTime) / Q_LIMIT / 1000),
        hesitancyNotes: state.hesitancy.length > 0 ? [...new Set(state.hesitancy)].join(", ") : "Žádné",
        categoryResults: catResults
    };

    fetch(SCRIPT_URL, { 
        method: 'POST', 
        mode: 'no-cors', 
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload) 
    });
}
</script>
</body>
</html>
