<!DOCTYPE html>
<html lang="cs" translate="no">
<head>
    <meta charset="UTF-8">
    <title>Rohlík.cz – Jazykový test (ČJ A1-A2)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="google" content="notranslate">
    <style>
        :root {
            --rohlik: #f6a623; --rohlik-glow: rgba(246, 166, 35, 0.4);
            --bg: #0f172a; --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f8fafc; --text-muted: #94a3b8;
            --success: #2ecc71; --danger: #e74c3c;
        }

        body {
            margin: 0; font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            user-select: none; -webkit-user-select: none;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%; max-width: 480px;
            margin: auto; transition: 0.4s;
        }

        header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .q-timer-ring {
            width: 40px; height: 40px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--rohlik);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px;
        }

        .progress-bar {
            position: fixed; top: 0; left: 0; height: 4px;
            background: var(--rohlik); transition: 0.3s;
            box-shadow: 0 0 15px var(--rohlik); z-index: 101;
        }

        h2 { font-weight: 800; letter-spacing: -1px; text-align: center; margin-bottom: 20px; }
        
        .alert-box {
            background: rgba(246, 166, 35, 0.1); border: 1px solid var(--rohlik);
            color: var(--rohlik); padding: 12px; border-radius: 12px;
            text-align: center; font-size: 14px; margin-bottom: 20px; line-height: 1.4;
        }

        input {
            width: 100%; padding: 16px; margin-bottom: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; color: white; font-size: 16px; outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--rohlik); background: rgba(255,255,255,0.1); }

        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: 18px;
            background: var(--rohlik); color: white; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

        .ans-btn {
            width: 100%; padding: 18px; margin-bottom: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px; color: var(--text); text-align: left;
            font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .ans-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .ans-btn.selected { border-color: var(--rohlik); background: var(--rohlik-glow); }

        #error-msg { color: var(--danger); text-align: center; font-weight: bold; margin: 10px 0; display: none; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .low-time { color: var(--danger); animation: pulse 1s infinite; }

        /* Styl pro blok chyb */
        #mistakes-container {
            max-height: 250px; overflow-y: auto; text-align: left;
            margin: 20px 0; padding-right: 10px; display: none; font-size: 14px;
        }
        #mistakes-container::-webkit-scrollbar { width: 6px; }
        #mistakes-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .mistake-item {
            background: rgba(255,255,255,0.05); padding: 12px;
            border-radius: 12px; margin-bottom: 10px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="progress" class="progress-bar"></div>

<header id="main-header" style="display:none;">
    <img src="rohlik-logo.png" style="height:25px;" onerror="this.style.display='none'">
    <div style="display:flex; gap:15px; align-items:center;">
        <div id="q-timer" class="q-timer-ring">60</div>
        <div id="q-idx" style="font-weight:bold; color:var(--text-muted)">1/25</div>
    </div>
</header>

<div class="container" style="flex:1; display:flex;">
    <div id="screen-login" class="glass-card">
        <h2>Jazykový test (A1-A2)</h2>
        <div class="alert-box">
            ⚠️ <b>Upozornění:</b> Test je pouze na <b>jeden pokus</b>.<br>Na každou otázku je časový limit 60 vteřin!
        </div>
        <input type="text" id="name-n" placeholder="Jméno kurýra">
        <input type="text" id="name-t" placeholder="Jméno trenéra">
        <input type="password" id="pass-t" placeholder="Heslo trenéra">
        <div id="error-msg"></div>
        <button class="btn-main" id="btn-start" onclick="startTest()">Spustit test</button>
    </div>

    <div id="screen-test" class="glass-card" style="display:none">
        <h3 id="q-text" style="line-height:1.4"></h3>
        <div id="answers"></div>
        <button class="btn-main" id="btn-next" onclick="nextQuestion()" disabled>Další otázka</button>
    </div>

    <div id="screen-res" class="glass-card" style="display:none; text-align:center;">
        <div id="res-icon" style="font-size:60px"></div>
        <h2 id="res-score"></h2>
        <p id="res-status" style="font-size:18px; font-weight:bold;"></p>
        
        <!-- Výpis chyb -->
        <div id="mistakes-container">
            <h4 style="margin-top:0; color:var(--danger); text-align:center;">Chyby v testu:</h4>
            <div id="mistakes-list"></div>
        </div>
    </div>
</div>

<script>
// --- OCHRANA PROTI OPAKOVANÉMU SPUŠTĚNÍ ---
document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("rohlikTestZablokovan") === "true") {
        document.getElementById("screen-login").innerHTML = `
            <h2 style="color:var(--danger); margin-bottom:10px;">Test byl již spuštěn</h2>
            <p style="text-align:center; line-height:1.5;">Tento test je povolen pouze na jeden pokus. Váš pokus byl již vyčerpán nebo došlo k obnovení stránky během testování.</p>
        `;
    }
});

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbylbGGi498B00Tyjrjhlo1FUJKPbWCr8QYsOX1cNUvav7inqfGAkvG-WExKolS0SmmE6A/exec";
const HASHED_PASS = "Uk9IMjY="; 
const Q_LIMIT = 25;
const SECONDS_PER_Q = 60;
const MAX_ERRORS = 5;

const BANK = [
  // GRAMATIKA - MINULÝ A BUDOUCÍ ČAS
  { cat: "Gramatika", q: "Omlouvám se, ___ jednu tašku v autě. Hned pro ni dojdu.", a: ["zapomněl jsem", "zapomenu", "zapomínám", "zapomněl"], c: 0 },
  { cat: "Gramatika", q: "Za pět minut ___ u vás před domem.", a: ["budu", "jsem", "byl", "být"], c: 0 },
  { cat: "Gramatika", q: "Paní Nováková, ___ platit kartou, nebo hotově?", a: ["budete", "jste", "byli", "být"], c: 0 },
  { cat: "Gramatika", q: "Včera na silnici ___ velká zácpa.", a: ["byla", "je", "bude", "být"], c: 0 },

  // GRAMATIKA - MODÁLNÍ SLOVESA A KONDICIONÁL
  { cat: "Gramatika", q: "___ byste mi prosím otevřít dveře dole?", a: ["Mohl", "Můžu", "Musel", "Chci"], c: 0 },
  { cat: "Gramatika", q: "Bohužel, tam s autem ___ parkovat.", a: ["nesmím", "nechci", "nebudu", "nedělám"], c: 0 },
  { cat: "Gramatika", q: "Zákazník musí nákup na terminálu ___.", a: ["zaplatit", "platil", "platím", "platíme"], c: 0 },
  { cat: "Gramatika", q: "___ se mi tady na displej, prosím.", a: ["Podepište", "Podepsat", "Píšu", "Kreslete"], c: 0 },

  // GRAMATIKA - PÁDY A PŘEDLOŽKY
  { cat: "Gramatika", q: "Mám tady pro ___ velký nákup.", a: ["vás", "vy", "vám", "váš"], c: 0 },
  { cat: "Gramatika", q: "Přijel jsem s ___.", a: ["nákupem", "nákup", "nákupu", "nákupy"], c: 0 },
  { cat: "Gramatika", q: "Dobrý den, vezu vám ___ z Rohlíku.", a: ["nákup", "auto", "zákazníka", "tašku"], c: 0 },
  { cat: "Gramatika", q: "Jsem s autem ___ domem, můžete přijít dolů?", a: ["před", "na", "v", "do"], c: 0 },
  { cat: "Gramatika", q: "Zaparkoval jsem hned ___ rohem.", a: ["za", "na", "do", "v"], c: 0 },
  { cat: "Gramatika", q: "Počkám na ___ venku u auta.", a: ["vás", "vy", "váš", "vám"], c: 0 },

  // SITUACE - ŘEŠENÍ PROBLÉMŮ A KOMUNIKACE
  { cat: "Situace", q: "Když se zákazník ptá: „Kolik to bude stát?“, co odpovíte?", a: ["Celkem to dělá 850 korun.", "Bude to v 8:00.", "Mám 850 korun.", "Chci 850 korun."], c: 0 },
  { cat: "Situace", q: "Máte v tašce rozbitá vajíčka. Co zákazníkovi řeknete?", a: ["Omlouvám se, hned to vyreklamuji a peníze se vám vrátí.", "To není můj problém, už to tak bylo.", "Musíte to zaplatit.", "Zavolejte na policii."], c: 0 },
  { cat: "Situace", q: "Zákazník není doma. Voláte mu a ptáte se:", a: ["Dobrý den, za jak dlouho budete doma?", "Kdo jste a kde jste?", "Proč nemáte nákup?", "Kde je auto?"], c: 0 },
  { cat: "Situace", q: "Výtah v domě nefunguje. Zákazníkovi do telefonu řeknete:", a: ["Výtah nefunguje, půjdu k vám po schodech.", "Zůstanu v autě, přijďte si pro to.", "Výtah je dole, nákup tam nechám.", "Nemám nohy, nechodím."], c: 0 },
  { cat: "Situace", q: "Jak se slušně omluvíte za to, že jedete pozdě kvůli dopravě?", a: ["Moc se omlouvám za zpoždění, byla špatná doprava.", "Tady jsem konečně.", "Jedu rychle, nestěžujte si.", "Proč tu nejste vy?"], c: 0 },
  { cat: "Situace", q: "Platební terminál nefunguje nebo nemá signál. Co řeknete?", a: ["Omlouvám se, terminál nemá signál, zkusíme to za chvíli znovu.", "Vaše karta je špatná a rozbitá.", "Nemáte na účtu žádné peníze.", "Běžte si vybrat hotovost."], c: 0 },
  { cat: "Situace", q: "Zákazník chce nákup zrušit (vrátit). Co mu řeknete?", a: ["Dobře, zavolám na zákaznickou podporu a zařídím storno.", "To nesmíte udělat.", "Stejně mi musíte dát peníze.", "To nevím, to je váš problém."], c: 0 },

  // SLOVNÍ ZÁSOBA A POROZUMĚNÍ
  { cat: "Slovní zásoba", q: "Zákazník vám řekne: „Drobné si nechte.“ Co to znamená?", a: ["Dává mi spropitné (dýško) za doručení.", "Nechce už nákup, můžu si ho nechat.", "Mám mu vrátit úplně všechny peníze.", "Mám peníze vyhodit do koše."], c: 0 },
  { cat: "Slovní zásoba", q: "Co znamená, když je v poznámce: „Zvoňte na Novák“?", a: ["Musím na panelu najít jméno Novák a zazvonit.", "Budu na ulici křičet Novák.", "Musím zavolat Novákovi na mobil.", "Zazvoním raději na všechny zvonky."], c: 0 },
  { cat: "Slovní zásoba", q: "Co znamená slovo „Účtenka“?", a: ["Papír z terminálu s potvrzením o nákupu a platbě.", "Peníze, které mi zákazník dává v hotovosti.", "Papírová taška, ve které je nákup.", "Zákazníkův občanský průkaz."], c: 0 },
  { cat: "Slovní zásoba", q: "Zákazník se ptá: „Máte na vrácení z tisícovky?“ Co tím myslí?", a: ["Jestli mám u sebe dost peněz, abych mu vrátil zbytek z 1000 Kč.", "Jestli chci tisíc korun pro sebe jako dýško.", "Jestli mu můžu rozměnit eura na tisícovku.", "Jestli mu k nákupu dám zdarma 1000 Kč."], c: 0 },
  { cat: "Slovní zásoba", q: "V aplikaci je poznámka: „Nechte nákup za dveřmi.“ Co uděláte?", a: ["Položím tašky s nákupem před dveře bytu.", "Otevřu dveře a dám tašky zákazníkovi do bytu.", "Zazvoním a musím čekat, dokud si to zákazník nevezme.", "Vrátím nákup do auta a odvezu ho zpět na sklad."], c: 0 },
  { cat: "Slovní zásoba", q: "Musíte zkontrolovat věk kvůli alkoholu. Co řeknete?", a: ["Mohl bych prosím vidět váš občanský průkaz?", "Kolik je vám let? (a nechám si to jen říct)", "Máte peníze na alkohol?", "Pijete alkohol často?"], c: 0 },
  { cat: "Slovní zásoba", q: "Co odpovíte, když se s vámi zákazník loučí slovy: „Nashledanou a hezký víkend!“", a: ["Děkuji, vám také. Na shledanou.", "Prosím.", "Ano, mám víkend.", "Ne, nemám víkend."], c: 0 },
  { cat: "Slovní zásoba", q: "Jak zdvořile oslovíte zákazníka, když mu předáváte nákup?", a: ["Dobrý den, tady je váš nákup.", "Ahoj, tady máš nákup.", "Čau, nesu věci.", "Nazdar, vem si to."], c: 0 }
];

let state = {
    current: 0, score: 0, testSet: [], selected: null,
    tabSwitches: 0, startTime: 0, qStartTime: 0,
    history: [], hesitancy: []
};

// Detekce opuštění záložky s testem
document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.testSet.length > 0) state.tabSwitches++;
});

function startTest() {
    // Pokud je test zablokován už z předchozí relace, nepustí dál
    if (localStorage.getItem("rohlikTestZablokovan") === "true") return;

    const n = document.getElementById('name-n').value.trim();
    const t = document.getElementById('name-t').value.trim();
    const p = document.getElementById('pass-t').value.trim();
    
    if (!n || !t) { document.getElementById('error-msg').innerText = "Vyplňte jména!"; document.getElementById('error-msg').style.display = 'block'; return; }
    if (btoa(p) !== HASHED_PASS) { document.getElementById('error-msg').innerText = "Špatné heslo!"; document.getElementById('error-msg').style.display = 'block'; return; }

    // Uložení zámku do prohlížeče (jeden pokus)
    localStorage.setItem("rohlikTestZablokovan", "true");

    state.testSet = BANK.sort(() => 0.5 - Math.random()).slice(0, Q_LIMIT);
    state.startTime = Date.now();
    
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('screen-test').style.display = 'block';
    
    renderQuestion();
}

let qTimer;
function renderQuestion() {
    clearInterval(qTimer);
    const q = state.testSet[state.current];
    
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('q-idx').innerText = `${state.current + 1}/${Q_LIMIT}`;
    document.getElementById('progress').style.width = `${(state.current / Q_LIMIT) * 100}%`;
    document.getElementById('btn-next').disabled = true;
    
    const ansDiv = document.getElementById('answers');
    ansDiv.innerHTML = "";
    state.selected = null;
    
    let answers = q.a.map((text, originalIndex) => ({ text, originalIndex }));
    for (let i = answers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [answers[i], answers[j]] = [answers[j], answers[i]];
    }
    
    answers.forEach(obj => {
        const b = document.createElement('button');
        b.className = "ans-btn";
        b.innerHTML = `<span>${obj.text}</span>`;
        b.onclick = () => {
            if (Date.now() - state.qStartTime < 500) return; 
            document.querySelectorAll('.ans-btn').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
            state.selected = obj.originalIndex;
            document.getElementById('btn-next').disabled = false;
        };
        ansDiv.appendChild(b);
    });

    let sec = SECONDS_PER_Q;
    state.qStartTime = Date.now();
    const timerDiv = document.getElementById('q-timer');
    timerDiv.innerText = sec;
    timerDiv.classList.remove('low-time');

    qTimer = setInterval(() => {
        sec--;
        timerDiv.innerText = sec;
        if (sec <= 10) timerDiv.classList.add('low-time');
        if (sec <= 0) {
            clearInterval(qTimer);
            nextQuestion(true); 
        }
    }, 1000);
}

function nextQuestion(isTimeout = false) {
    const q = state.testSet[state.current];
    const timeSpent = (Date.now() - state.qStartTime) / 1000;
    
    let qCategory = q.cat || "Obecné";
    if (timeSpent > 30) state.hesitancy.push(qCategory);

    const isCorrect = (!isTimeout && state.selected === q.c);
    if (isCorrect) state.score++;
    
    state.history.push({ 
        cat: qCategory, 
        correct: isCorrect,
        question: q.q,
        userAnswer: isTimeout ? "Vypršel čas" : (state.selected !== null ? q.a[state.selected] : "Žádná odpověď"),
        correctAnswer: q.a[q.c]
    });

    if (state.current < Q_LIMIT - 1) {
        state.current++;
        renderQuestion();
    } else {
        finish();
    }
}

function finish() {
    clearInterval(qTimer);
    const passed = state.score >= (Q_LIMIT - MAX_ERRORS);
    const perc = Math.round((state.score / Q_LIMIT) * 100);
    
    let catResults = {};
    state.history.forEach(h => {
        if (!catResults[h.cat]) catResults[h.cat] = { correct: 0, total: 0 };
        catResults[h.cat].total++;
        if (h.correct) catResults[h.cat].correct++;
    });

    document.getElementById('screen-test').style.display = 'none';
    document.getElementById('main-header').style.display = 'none';
    document.getElementById('progress').style.display = 'none';
    document.getElementById('screen-res').style.display = 'block';

    document.getElementById('res-score').innerText = `${state.score} / ${Q_LIMIT}`;
    document.getElementById('res-icon').innerText = passed ? "🎉" : "❌";
    document.getElementById('res-status').innerText = passed ? "SKVĚLÉ, PROŠEL(A) JSI!" : "BOHUŽEL, TO NESTAČÍ.";
    document.getElementById('res-status').style.color = passed ? "var(--success)" : "var(--danger)";

    // Generování výpisu chyb
    const mistakesContainer = document.getElementById('mistakes-container');
    const mistakesList = document.getElementById('mistakes-list');
    const errors = state.history.filter(h => !h.correct);
    
    if (errors.length > 0) {
        mistakesContainer.style.display = 'block';
        errors.forEach(err => {
            const div = document.createElement('div');
            div.className = 'mistake-item';
            div.innerHTML = `
                <div style="font-weight:bold; margin-bottom:5px;">${err.question}</div>
                <div style="color:var(--danger); margin-bottom:3px;">❌ ${err.userAnswer}</div>
                <div style="color:var(--success);">✅ ${err.correctAnswer}</div>
            `;
            mistakesList.appendChild(div);
        });
    }

    const payload = {
        noviceName: document.getElementById('name-n').value.trim(),
        trainerName: document.getElementById('name-t').value.trim(),
        score: state.score,
        total: Q_LIMIT,
        percent: perc,
        passed: passed,
        tabSwitches: state.tabSwitches,
        avgTimePerQ: Math.round((Date.now() - state.startTime) / Q_LIMIT / 1000),
        hesitancyNotes: state.hesitancy.length > 0 ? [...new Set(state.hesitancy)].join(", ") : "Žádné",
        categoryResults: catResults
    };

    fetch(SCRIPT_URL, { 
        method: 'POST', 
        mode: 'no-cors', 
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload) 
    });
}
</script>
</body>
</html>
